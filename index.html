<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Locator</title>
</head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<style>

    body{
        background-image: url(image.png);
        background-size: cover;
        background-repeat: no-repeat;
        font-family: Arial, Helvetica, sans-serif;
        max-width: 100%;
        max-height: 100%;
        overflow-x: hidden;
    }
    .header{
        background-color: beige;
        color: rgb(83, 78, 66);
        padding: 20px;
        text-align: center;
    }
    .box{
        background-color: rgba(245, 245, 220, 0.581);
        padding: 30px;
        border-radius: 10px;
        margin-top: 20px;
        text-align: center;
    }
    .itemimg{
        width: 200px;
        height: 200px;
        object-fit: cover;
    }
    .button{
        padding: 2px;
        border-radius: 5px;
        background-color: bisque;
    }
    .branches{
        padding-bottom: 15px;
        background-color: beige;
    }
    a{
        color: rgb(83, 78, 66);;
    }
</style>
<body>
<div class="header">
    <h1>Baritza Menu</h1>
    <h2>Budget Item Finder</h2>
</div>

<div class="container">
<div class="box">
    <p>What's your budget? Automatically find what fits it!</p>
    <input type="number" id="budget" class="form-control" placeholder="???">
    <button class="btn" onclick="foodSuggestion">Find Meal</button>
    <h3 id="result"></h3>
</div>

<div class="row text-center mt-5" id="fooditems">
    <div class="col-md-4">
        <h4>Mushroom Pepper Rice</h4>
        <img src="mushroompepperrice.png"class="itemimg">
    </div>
    <div class="col-md-4">
        <h4>Bagnet w/KBL</h4>
        <img src="bagnetwkbl.png"class="itemimg">
    </div>
    <div class="col-md-4">
        <h4>Gyudon</h4>
        <img src="gyudon.png"class="itemimg">
    </div>
    <div class="col-md-4">
        <h4>Tofu Sisig</h4>
        <img src="tofusisig.png"class="itemimg">
    </div>
    <div class="col-md-4">
        <h4>Tonkotsu Curry</h4>
        <img src="tonkotsucurry.png"class="itemimg">
    </div>
    <div class="col-md-4">
        <h4>Mozzarella Sticks</h4>
        <img src="mozzarellasticks.png" class="itemimg">
    </div>

</div>

</div>
<br>
<h2 class="text-center">Baritza Links</h2>
<div class="row text-center mt-4" id="branches">
    <div class="col-md-4">
        <a href="https://www.facebook.com/baritza.lu">SFC, La Union Branch</a>
    </div>
    <div class="col-md-4">
        <a href="https://www.instagram.com/baritzacafe/?hl=en">Baritza Instagram</a>
    </div>
    <div class="col-md-4">
        <a href="https://www.facebook.com/baritza.lu">Bauang Branch</a>
    </div>
</div>
    <script>
        function foodSuggestion (){
            let budget = document.getElementById("budget").value;
            let message = "";
        }
        if (budget >= 280) {
            message = "You can order gyudon!";
        }
        else if (budget >= 260) {
            message = "You can order bagnet w/kbl!";
        }
        else if (budget >= 250) {
            message = "You can order tonkontsu curry!";
        }
        else if (budget >= 220) {
            message = "You can order mozzarella sticks!";
        }
        else if (budget >= 200) {
            message = "You can order mushroom pepper rice!";
        }
        else if (budget >= 180) {
            message = "You can order tofu sisig!";
        }
        else if (budget <=179){
            message = "insufficient budget...";
        }
        document.getElementById("result").innerHTML = message;

       
    </script>
</body>
</html>
